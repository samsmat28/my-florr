<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Florr Clone — Cosmic & Divine Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { overflow: hidden; background: #1ea761; }
    canvas { display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; }

    #top-bar { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; }
    .badge { background: rgba(0, 0, 0, 0.5); color: #fff; padding: 8px 16px; border-radius: 12px; font-weight: bold; font-size: 14px; border: 2px solid rgba(255, 255, 255, 0.25); }

    #side-buttons { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
    .menu-btn { width: 62px; height: 62px; border-radius: 14px; border: 3px solid rgba(0, 0, 0, 0.45); background: #ffc844; color: #fff; font-weight: 900; font-size: 12px; cursor: pointer; text-shadow: 0 2px 2px rgba(0, 0, 0, 0.7); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); transition: transform 0.1s; }
    .menu-btn:active { transform: translateY(3px); }
    #btn-craft { background: #de6328; }
    #btn-quests { background: #2b9348; }
    #btn-promo { background: #9b30ff; }
    #btn-map { background: #3a86ff; }

    #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: auto; background: rgba(0, 0, 0, 0.3); padding: 10px; border-radius: 18px; }
    #hint { position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%); color: rgba(255, 255, 255, 0.9); font-size: 13px; font-weight: bold; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }

    .slot { width: 66px; height: 66px; border-radius: 12px; border: 3px solid rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-weight: bold; font-size: 12px; text-shadow: 0 1px 3px #000; transition: transform 0.1s; }
    .slot:hover { transform: scale(1.06); }
    .slot.selected { outline: 4px solid #fff; }
    .slot-rarity { font-size: 10px; opacity: 0.95; margin-top: 2px; }

    .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(25, 30, 40, 0.95); border: 4px solid #111; border-radius: 20px; padding: 20px; width: 480px; max-width: 92vw; color: #fff; pointer-events: auto; display: none; box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7); z-index: 30; }
    .modal.open { display: block; }
    .modal h2 { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 17px; }
    .close-btn { background: #e74c3c; border: none; color: #fff; width: 30px; height: 30px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 290px; overflow-y: auto; padding: 4px; }
    .inv-item { height: 70px; border-radius: 10px; border: 3px solid rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; font-weight: bold; text-shadow: 0 1px 2px #000; position: relative; }
    .inv-item:hover { transform: scale(1.04); }
    .inv-count { position: absolute; top: 3px; right: 5px; font-size: 11px; background: rgba(0, 0, 0, 0.6); padding: 1px 5px; border-radius: 6px; }
    #craft-msg { margin-top: 12px; text-align: center; font-weight: bold; font-size: 14px; min-height: 22px; color: #ffd700; }

    /* Стартовое меню */
    #start-screen { position: fixed; inset: 0; background: rgba(20, 110, 65, 0.72); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .start-box { background: rgba(25, 32, 42, 0.94); border: 4px solid #111; border-radius: 24px; padding: 32px 40px; text-align: center; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6); width: 380px; max-width: 90vw; }
    .game-title { color: #fff; font-size: 40px; font-weight: 900; text-shadow: 0 4px 0 #000; }
    .game-title span { color: #ffd700; font-size: 24px; }
    .game-sub { color: #d946ef; font-weight: bold; margin-bottom: 22px; font-size: 15px; }
    #player-name-input { width: 100%; padding: 12px 16px; font-size: 18px; font-weight: bold; text-align: center; border-radius: 12px; border: 3px solid #111; margin-bottom: 16px; background: #fff; color: #222; }
    #btn-play { width: 100%; padding: 14px; font-size: 22px; font-weight: 900; color: #fff; background: #7eef6d; border: 3px solid #111; border-radius: 14px; cursor: pointer; text-shadow: 0 2px 2px rgba(0, 0, 0, 0.7); box-shadow: 0 5px 0 #3a8c2e; }
    #btn-play:active { transform: translateY(3px); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Стартовый экран -->
  <div id="start-screen">
    <div class="start-box">
      <h1 class="game-title">florr.io <span>CLONE</span></h1>
      <p class="game-sub">Cosmic & Divine Edition</p>
      <input type="text" id="player-name-input" maxlength="16" placeholder="Введи имя цветка..." value="Matvei">
      <button id="btn-play">ИГРАТЬ</button>
    </div>
  </div>

  <!-- Игровой интерфейс -->
  <div id="ui" style="display: none;">
    <div id="top-bar">
      <div class="badge" id="zone-badge">Карта: Garden (Сад)</div>
      <div class="badge" id="level-badge">Уровень: 1 (0 / 100 XP)</div>
      <div class="badge" id="save-badge">Автосохранение: ВКЛ</div>
    </div>

    <div id="side-buttons">
      <button class="menu-btn" id="btn-inv">Сумка<br>[X]</button>
      <button class="menu-btn" id="btn-craft">Крафт<br>[C]</button>
      <button class="menu-btn" id="btn-quests">Задания<br>[Q]</button>
      <button class="menu-btn" id="btn-promo">Коды<br>[P]</button>
      <button class="menu-btn" id="btn-map">Карта<br>[M]</button>
    </div>

    <div id="hint">ЛКМ — Атака | ПКМ — Щит | Клик по слоту внизу — заменить лепесток</div>
    <div id="hotbar"></div>

    <!-- Окно Сумки -->
    <div class="modal" id="modal-inv">
      <h2>
        <span>Сумка (нажми, чтобы надеть)</span>
        <button class="close-btn" onclick="closeModals()">X</button>
      </h2>
      <div class="inv-grid" id="inv-grid"></div>
    </div>

    <!-- Окно Крафта -->
    <div class="modal" id="modal-craft">
      <h2>
        <span>Крафт (нужно 5 одинаковых)</span>
        <button class="close-btn" onclick="closeModals()">X</button>
      </h2>
      <div class="inv-grid" id="craft-grid"></div>
      <div id="craft-msg">Выбери лепесток (от 5 шт.) для улучшения редкости!</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const RARITIES = [
      { name: 'Common',    color: '#7eef6d', mult: 1,    craftChance: 0.65 },
      { name: 'Unusual',   color: '#ffe65d', mult: 1.8,  craftChance: 0.45 },
      { name: 'Rare',      color: '#4d52e3', mult: 3.2,  craftChance: 0.30 },
      { name: 'Epic',      color: '#861fde', mult: 5.8,  craftChance: 0.20 },
      { name: 'Legendary', color: '#de1f1f', mult: 10.5, craftChance: 0.14 },
      { name: 'Mythic',    color: '#1fdbde', mult: 20,   craftChance: 0.10 },
      { name: 'Exotic',    color: '#ff2b75', mult: 38,   craftChance: 0.08 },
      { name: 'Ultimate',  color: '#2bffa3', mult: 72,   craftChance: 0.06 },
      { name: 'Cosmic',    color: '#d946ef', mult: 140,  craftChance: 0.04 },
      { name: 'Divine',    color: '#ffd700', mult: 280,  craftChance: 0 }
    ];

    function getRarity(idx) {
      return RARITIES[idx] || RARITIES.at(0);
    }

    const PETALS = {
      basic:    { name: 'Basic',    dmg: 12, hp: 15, cd: 1.2, count: 1, color: '#ffffff', stroke: '#cccccc', shape: 'circle' },
      stinger:  { name: 'Stinger',  dmg: 45, hp: 5,  cd: 2.2, count: 1, color: '#333333', stroke: '#111111', shape: 'triangle' },
      leaf:     { name: 'Leaf',     dmg: 10, hp: 12, cd: 1.4, count: 1, color: '#3cd070', stroke: '#259b4e', shape: 'circle', heal: 5 },
      dust:     { name: 'Dust',     dmg: 15, hp: 10, cd: 0.8, count: 3, color: '#b8c4cc', stroke: '#7a8891', shape: 'circle' },
      triangle: { name: 'Triangle', dmg: 38, hp: 18, cd: 1.5, count: 1, color: '#ff5252', stroke: '#b71c1c', shape: 'triangle' },
      void:     { name: 'Void',     dmg: 85, hp: 45, cd: 1.8, count: 1, color: '#2b0a3d', stroke: '#c084fc', shape: 'void' }
    };

    const WORLD_SIZE = 3000;
    let selectedSlot = 0;
    let isPlaying = false;

    const defaultSave = {
      playerName: 'Matvei',
      level: 1,
      xp: 0,
      nextXp: 100,
      slots: [
        { type: 'basic', rarity: 0 },
        { type: 'dust', rarity: 0 },
        { type: 'leaf', rarity: 0 },
        { type: 'triangle', rarity: 1 },
        { type: 'stinger', rarity: 0 }
      ],
      inventory: [
        { type: 'basic', rarity: 0, count: 5 },
        { type: 'dust', rarity: 0, count: 5 },
        { type: 'triangle', rarity: 1, count: 5 },
        { type: 'void', rarity: 8, count: 5 }
      ]
    };

    let saveData;
    try {
      saveData = JSON.parse(localStorage.getItem('myFlorrSaveV2')) || defaultSave;
    } catch (e) {
      saveData = defaultSave;
    }

    function saveGame() {
      localStorage.setItem('myFlorrSaveV2', JSON.stringify(saveData));
    }

    const nameInput = document.getElementById('player-name-input');
    nameInput.value = saveData.playerName;

    function startGame() {
      const newName = nameInput.value.trim();
      saveData.playerName = newName ? newName : 'Matvei';
      saveGame();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('ui').style.display = 'block';
      isPlaying = true;
      rebuildActivePetals();
      renderUI();
    }
